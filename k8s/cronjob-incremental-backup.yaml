apiVersion: batch/v1
kind: CronJob
metadata:
  name: aam-cost-physical-backup
  namespace: database-ops
spec:
  schedule: "0 */6 * * *"
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 5
  concurrencyPolicy: Forbid
  jobTemplate:
    spec:
      backoffLimit: 2
      template:
        spec:
          serviceAccountName: postgres-backup-sa
          restartPolicy: OnFailure
          containers:
            - name: backup
              image: <YOUR_ECR_REPO>/postgres-backup-recovery:latest
              imagePullPolicy: IfNotPresent
              command: ["python3", "backup.py", "incremental"]
              envFrom:
                - configMapRef:
                    name: postgres-backup-config
                - secretRef:
                    name: postgres-backup-secret
              resources:
                requests:
                  cpu: "500m"
                  memory: "1Gi"
                limits:
                  cpu: "2"
                  memory: "2Gi"
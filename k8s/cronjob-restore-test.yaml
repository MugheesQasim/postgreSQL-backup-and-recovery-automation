apiVersion: batch/v1
kind: CronJob
metadata:
  name: aam-cost-restore-test
  namespace: database-ops
spec:
  schedule: "30 3 * * *"
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 5
  concurrencyPolicy: Forbid
  jobTemplate:
    spec:
      backoffLimit: 1
      template:
        spec:
          serviceAccountName: postgres-backup-sa
          restartPolicy: OnFailure
          containers:
            - name: restore-test
              image: <YOUR_ECR_REPO>/postgres-backup-recovery:latest
              imagePullPolicy: IfNotPresent
              command: ["python3", "restore_test.py"]
              envFrom:
                - configMapRef:
                    name: postgres-backup-config
                - secretRef:
                    name: postgres-backup-secret
              resources:
                requests:
                  cpu: "500m"
                  memory: "1Gi"
                limits:
                  cpu: "2"
                  memory: "2Gi"